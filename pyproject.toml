[project]
name = "floowandereeze-and-modding-dl"
version = "0.1.0"
description = "A modding tool for Yu-Gi-Oh! Duel Links, built with PySide6 (Qt6)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Nauder", email = "prestes.nauder@gmail.com" },
]
urls = { Repository = "https://github.com/Nauder/floowandereeze-and-modding-dl" }
dependencies = [
    "PySide6>=6.7.2",
    "pyqt-toast-notification>=1.3.2",
    "SQLAlchemy>=2.0.34",
    "UnityPy>=1.10.18",
    "Pillow>=10.4.0",
    "requests>=2.32.4",
    "pyarrow>=17.0.0",
]

[project.scripts]
floowandereeze = "scripts.dev:main"
floo-capture = "capture_docs:main"
floo-build-qt = "scripts.build_qt:main"
floo-build = "scripts.build:main"
floo-dev = "scripts.dev:main"
floo-test = "scripts.test:main"
floo-lint = "scripts.check:lint_main"
floo-format-check = "scripts.check:format_main"
floo-format = "scripts.check:fix_main"
floo-check = "scripts.check:main"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
build = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["database", "dialogs", "pages", "scripts", "services", "unity", "util", "widgets"]

[tool.ruff]
target-version = "py312"
exclude = [
    "qtdesigner/resources_rc.py",
    "pages/ui",
    "local",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["database", "dialogs", "pages", "scripts", "services", "tests", "unity", "util", "widgets"]

[tool.ruff.lint.per-file-ignores]
"tests/test_quality_of_life.py" = ["E402"]
